name: Create Issue on Push

on: push

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Create a new issue
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues" \
            -f title="Push 이벤트가 발생했습니다" \
            -f body="저장소에 변경사항이 올라와 자동으로 생성된 이슈입니다." \
            --jq '.html_url'
